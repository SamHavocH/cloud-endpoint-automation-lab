name: Validate and Simulate Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.15.4"

jobs:
  backend-quality:
    name: Backend tests and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ruff lint
        run: python -m ruff check .

      - name: Run pytest
        run: python -m pytest

  dashboard-quality:
    name: Dashboard syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dashboard dependencies
        run: python -m pip install -r dashboard/requirements.txt

      - name: Compile Streamlit app
        run: python -m py_compile dashboard/app.py

  docker-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build demo containers
        run: docker compose build

  terraform-validation:
    name: Terraform format and validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/azure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  deployment-simulation:
    name: Simulated deployment readiness
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - dashboard-quality
      - docker-validation
      - terraform-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deployment simulation summary
        run: |
          mkdir -p build
          cat > build/deployment-simulation.md <<'EOF'
          # Deployment Simulation

          This workflow validates the project as if it were being prepared for an internal cloud/platform deployment.

          ## Validated

          - Backend tests and linting completed.
          - Dashboard Python syntax check completed.
          - Docker Compose configuration and image builds completed.
          - Terraform formatting, initialization, and validation completed.

          ## Simulated Deployment Steps

          1. Build backend and dashboard containers.
          2. Validate Terraform Azure foundation.
          3. Confirm demo application can be started with Docker Compose.
          4. Mark the release candidate as ready for manual Azure planning.

          ## Notes

          No Azure resources are created by this workflow. A real deployment would add authenticated
          `terraform plan` and `terraform apply` jobs using federated identity or managed credentials.
          EOF

      - name: Publish simulation summary
        run: cat build/deployment-simulation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-simulation
          path: build/deployment-simulation.md
