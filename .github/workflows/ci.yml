name: Validate and Simulate Deployment

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to simulate deployment for
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.15.4"

jobs:
  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest

    outputs:
      deployment_environment: ${{ steps.resolve.outputs.deployment_environment }}
      terraform_var_file: ${{ steps.resolve.outputs.terraform_var_file }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}

    steps:
      - name: Resolve environment from branch or manual input
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target_environment="${{ inputs.target_environment }}"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            target_environment="production"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            target_environment="production"
          else
            target_environment="development"
          fi

          if [[ "$target_environment" == "production" ]]; then
            terraform_var_file="environments/production.tfvars"
            release_channel="stable"
          else
            terraform_var_file="environments/development.tfvars"
            release_channel="dev"
          fi

          {
            echo "deployment_environment=$target_environment"
            echo "terraform_var_file=$terraform_var_file"
            echo "release_channel=$release_channel"
          } >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Target Environment

          - Environment: $target_environment
          - Terraform variables: $terraform_var_file
          - Release channel: $release_channel
          EOF

  backend-quality:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    needs: resolve-environment

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ruff lint
        run: python -m ruff check .

      - name: Run pytest
        run: python -m pytest

  dashboard-quality:
    name: Dashboard syntax check
    runs-on: ubuntu-latest
    needs: resolve-environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dashboard dependencies
        run: python -m pip install -r dashboard/requirements.txt

      - name: Compile Streamlit app
        run: python -m py_compile dashboard/app.py

  docker-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: resolve-environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build demo containers
        run: docker compose build

  terraform-validation:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    needs: resolve-environment

    defaults:
      run:
        working-directory: infra/azure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  deployment-simulation:
    name: Simulated ${{ needs.resolve-environment.outputs.deployment_environment }} deployment
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ needs.resolve-environment.outputs.deployment_environment }}
    needs:
      - resolve-environment
      - backend-quality
      - dashboard-quality
      - docker-validation
      - terraform-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deployment simulation summary
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.resolve-environment.outputs.deployment_environment }}
          RELEASE_CHANNEL: ${{ needs.resolve-environment.outputs.release_channel }}
          TERRAFORM_VAR_FILE: ${{ needs.resolve-environment.outputs.terraform_var_file }}
        run: |
          mkdir -p build
          cat > build/deployment-simulation.md <<'EOF'
          # Deployment Simulation

          This workflow validates the project as if it were being prepared for an internal cloud/platform deployment.

          ## Target

          - Environment: ${DEPLOYMENT_ENVIRONMENT}
          - Release channel: ${RELEASE_CHANNEL}
          - Terraform variables: infra/azure/${TERRAFORM_VAR_FILE}

          ## Validated

          - Backend tests and linting completed.
          - Dashboard Python syntax check completed.
          - Docker Compose configuration and image builds completed.
          - Terraform formatting, initialization, and validation completed.

          ## Simulated Deployment Steps

          1. Select the environment from the branch or manual workflow input.
          2. Build backend and dashboard containers.
          3. Validate Terraform Azure foundation.
          4. Select the environment-specific Terraform variable file.
          5. Mark the release candidate as ready for manual Azure planning.

          ## Notes

          No Azure resources are created by this workflow. A real deployment would add authenticated
          `terraform plan -var-file="${TERRAFORM_VAR_FILE}"` and `terraform apply` jobs using
          federated identity or managed credentials.
          EOF

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("build/deployment-simulation.md")
          content = path.read_text()
          replacements = {
              "${DEPLOYMENT_ENVIRONMENT}": os.environ["DEPLOYMENT_ENVIRONMENT"],
              "${RELEASE_CHANNEL}": os.environ["RELEASE_CHANNEL"],
              "${TERRAFORM_VAR_FILE}": os.environ["TERRAFORM_VAR_FILE"],
          }
          for key, value in replacements.items():
              content = content.replace(key, value)
          path.write_text(content)
          PY

      - name: Publish simulation summary
        run: cat build/deployment-simulation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-simulation
          path: build/deployment-simulation.md
